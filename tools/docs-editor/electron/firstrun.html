<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self'">
<title>R'th Codex</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0c0b09; color: #ddd3bf; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; user-select: none; }
  main { width: 420px; text-align: center; }
  img { width: 64px; height: 64px; margin-bottom: 10px; }
  h1 { font: 700 18px/1 Georgia, serif; letter-spacing: 3px; text-transform: uppercase; color: #e0c387; margin: 0 0 8px; }
  .sub { color: #a89c86; margin: 0 0 26px; }
  .bar { height: 8px; border-radius: 4px; background: #1d1912; border: 1px solid #3b3226; overflow: hidden; }
  .fill { height: 100%; width: 0; background: linear-gradient(90deg, #a5824a, #e0c387); transition: width .25s ease-out; }
  .bar.waiting .fill { width: 30%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  #what { margin-top: 10px; font-size: 13px; color: #a89c86; min-height: 1.5em; }
  #problem { display: none; margin-top: 14px; color: #f0a08f; font-size: 13.5px; }
  button { margin-top: 14px; height: 32px; padding: 0 18px; border: 1px solid #c9a25e; border-radius: 4px; background: #c9a25e; color: #231707; font: 600 13px/1 inherit; cursor: pointer; }
  button:hover { background: #dcb46c; }
  .other { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 12px; }
  .other a { color: #6f6553; text-decoration: none; cursor: pointer; }
  .other a:hover { color: #a89c86; text-decoration: underline; }
</style>
</head>
<body>
<main>
  <img src="../assets/logo-96.png" alt="">
  <h1>R'th Codex</h1>
  <p class="sub">Getting the design docs ready. This happens once and takes about a minute.</p>
  <div class="bar waiting" id="bar"><div class="fill" id="fill"></div></div>
  <div id="what">Connecting…</div>
  <div id="problem"></div>
  <button id="again" hidden>Try again</button>
</main>
<div class="other"><a id="choose" title="For the game's developers">I already have the game's repository</a></div>
<script>
  const $ = (s) => document.querySelector(s);
  window.codex.onProgress(({ percent, text }) => {
    $("#bar").classList.toggle("waiting", !percent);
    $("#fill").style.width = (percent || 0) + "%";
    $("#what").textContent = text + (percent ? "… " + percent + "%" : "…");
  });
  async function go() {
    $("#problem").style.display = "none"; $("#again").hidden = true;
    $("#bar").classList.add("waiting"); $("#what").textContent = "Connecting…";
    const r = await window.codex.fetch();
    if (r?.error) {
      $("#bar").classList.remove("waiting"); $("#fill").style.width = "0";
      $("#what").textContent = "";
      $("#problem").textContent = r.error; $("#problem").style.display = "block";
      $("#again").hidden = false;
    } else if (r?.ok) $("#what").textContent = "Ready. Opening the Codex…";
  }
  $("#again").onclick = go;
  $("#choose").onclick = async () => {
    const r = await window.codex.choose();
    if (r?.error) { $("#problem").textContent = r.error; $("#problem").style.display = "block"; }
  };
  go();
</script>
</body>
</html>
