<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R'th Codex</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <button id="brandBtn" class="brand-btn" title="Layout: which panes to show"><img class="brand-logo" src="/logo.png" alt="R'th"><span class="brand-name">Codex</span></button>
      <button id="pagesBtn" class="top-btn pane-btn"></button>
    </div>
    <button id="quickOpen" class="search-trigger" title="Search (Ctrl+P)">
      <svg class="search-ico" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg><span>Search pages and text…</span><kbd>Ctrl P</kbd>
    </button>
    <div class="top-actions">
      <button id="outlineBtn" class="top-btn pane-btn"></button>
      <button id="helpBtn" class="top-btn" title="Keys and help (?)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg></button>
      <span class="account-wrap"><button id="accountBtn" class="top-btn account-btn"></button><div id="here" class="here hidden"></div></span>
    </div>
  </header>

  <aside id="sidebar" class="window">
    <div class="titlebar"><span class="ico ico-journal"></span><span class="win-title">Pages</span><button id="newPage" class="tb pane-tb" title="New page"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg></button></div>
    <div class="win-body">
      <div id="treePane" class="pane">
        <input id="treeFilter" class="field" placeholder="Filter pages" spellcheck="false">
        <nav id="tree"></nav>
      </div>
    </div>
  </aside>

  <main id="main" class="window">
    <div class="titlebar doc-titlebar">
      <button id="backBtn" class="tb nav-btn" title="Back (Alt+←)"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button id="fwdBtn" class="tb nav-btn" title="Forward (Alt+→)"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <div id="crumbs" class="crumbs"></div>
      <div id="crumbHere" class="crumb-here hidden"></div>
      <button id="sourceBtn" class="tb source-btn" title="Edit the Markdown source"><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg></button>
      <button id="commentBtn" class="tb comment-btn" title="Comment on this page (Ctrl+M with nothing selected)"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M12 8v5M9.5 10.5h5"/></svg></button>
      <button id="historyBtn" class="tb history-btn" title="All comments, across every page"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><span id="historyCount"></span></button>
      <button id="deleteBtn" class="tb delete-btn" title="Delete this page"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg></button>
    </div>
    <div id="toolbar" class="toolbar hidden"></div>
    <div id="togetherBar" class="ai-bar together-bar hidden"></div>
    <div id="readOnlyBar" class="ai-bar hidden"><span class="ai-bar-ico">✦</span><span class="ai-bar-text">Reading only. Sign in with Discord (top right) to edit; you need the Codex role in the R'th Discord.</span></div>
    <div id="banner" class="banner hidden"></div>
    <div id="scroller">
      <div id="docWrap"><article id="page" class="prose"></article><aside id="commentRail"></aside></div>
      <textarea id="source" class="hidden" spellcheck="false"></textarea>
    </div>
    <div id="statusView" class="hidden"></div>
    <div id="historyPanel" class="window hidden"></div>
    <footer id="status" class="statusbar"><span id="statusLeft"></span><span id="statusComments"></span><span id="statusRight"></span></footer>
  </main>

  <aside id="outlineWin" class="window">
    <div class="titlebar">
      <div class="tabs">
        <button class="tab active" data-tab="outline" title="The headings on this page"><span class="ico ico-scripture"></span>Outline</button>
        <button class="tab" data-tab="links" title="What links here, and what this links to"><span class="ico ico-links"></span>Links<span id="linksCount" class="tab-count"></span></button>
        <button class="tab" data-tab="ai" title="Talk with the AI about this page or the design (Ctrl+J)"><span class="ico ico-ai"></span>AI</button>
      </div>
    </div>
    <div class="win-body"><nav id="outline"></nav><div id="linksPane" class="hidden"></div></div>
  </aside>
</div>

<div id="sheetBackdrop" class="hidden"></div>
<div id="modalHost"></div>
<div id="toasts"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
