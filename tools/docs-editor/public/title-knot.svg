<svg xmlns="http://www.w3.org/2000/svg" viewBox="-19 -19 38 38" fill="none">
  <!-- A Celtic knot diamond: one band, a diamond whose every corner loops round and crosses itself.
       Drawn with a dark casing under the gold, so a strand redrawn on top reads as passing over. -->
  <defs>
    <path id="band" d="M-6-6L3-15C6-18-6-18-3-15L6-6L15 3C18 6 18-6 15-3L6 6L-3 15C-6 18 6 18 3 15L-6 6L-15-3C-18-6-18 6-15 3Z"/>
    <!-- where the band enters each corner's loop, it passes over: the strand coming out goes under -->
    <path id="over" d="M-2.5-9.5L2-14M9.5-2.5L14 2M2.5 9.5L-2 14M-9.5 2.5L-14-2"/>
  </defs>
  <use href="#band" stroke="#0d0c0a" stroke-width="3.8" stroke-linejoin="round"/>
  <use href="#band" stroke="#c9a25e" stroke-width="1.7" stroke-linejoin="round"/>
  <use href="#over" stroke="#0d0c0a" stroke-width="3.8"/>
  <use href="#over" stroke="#c9a25e" stroke-width="1.7"/>
  <!-- its heart -->
  <path d="M0-3.6L3.6 0L0 3.6L-3.6 0Z" fill="#c9a25e"/>
</svg>
